# 패키지 배포 — 태그를 밀 때만 돈다.
#
# 왜 태그 트리거인가.
#   ADR-0005는 "docs/ 변경은 배포를 트리거하지 않도록 경로 필터를 건다"를 요구했다.
#   태그 트리거는 그보다 강하다. main에 무엇을 밀든 배포가 일어나지 않고,
#   사람이 릴리스를 의도한 순간에만 돈다. SemVer 판정도 태그를 붙이는 사람이 한다
#   ("호환 불가 변경은 major" — ADR-0005). 경로 필터는 validate.yml에 남겼다.
#
# 배포 전에 태그·package.json·gradle.properties 세 값이 같은지 확인한다.
# 태그만 올리고 파일을 안 고치는 실수가 가장 흔하다.
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: 태그와 파일의 버전이 같은지 확인
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SPEC=$(node -p "require('./api-spec/package.json').version")
          FIX=$(node -p "require('./fixtures/package.json').version")
          GRADLE=$(grep '^sharedVersion=' gradle.properties | cut -d= -f2)
          echo "tag=$TAG api-spec=$SPEC fixtures=$FIX gradle=$GRADLE"
          if [ "$TAG" != "$SPEC" ] || [ "$TAG" != "$FIX" ] || [ "$TAG" != "$GRADLE" ]; then
            echo "::error::버전 불일치 — tag=$TAG, api-spec=$SPEC, fixtures=$FIX, gradle=$GRADLE"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  npm:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-spec
    steps:
      - uses: actions/checkout@v4

      # registry-url을 주면 setup-node가 .npmrc를 만들어 준다.
      # 저장소에 .npmrc를 커밋하지 않는 이유다 — 토큰이 들어가는 파일이다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@devc-showcase'
          cache: npm
          cache-dependency-path: api-spec/package-lock.json

      - run: npm ci

      # prepack이 generate를 부르므로 dist/가 여기서 만들어진다.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fixtures:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@devc-showcase'

      # 배포 전에 한 번 더 검사한다. 깨진 시드가 나가면 네 구현이 모두 그걸 본다.
      - run: npm run lint

      # 빌드 단계가 없다. JSON을 그대로 싣는다.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
