# 명세 검증 — 배포하지 않는다.
#
# 경로 필터를 건 이유: docs/ 변경으로 이 워크플로가 돌 이유가 없다(ADR-0005).
# 문서 수정 커밋이 잦은 저장소라 필터가 없으면 CI 결과가 소음이 된다.
name: validate

on:
  push:
    branches: [main]
    paths:
      - 'api-spec/**'
      - 'tokens/**'
      - 'fixtures/**'
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'api-spec/**'
      - 'tokens/**'
      - 'fixtures/**'
      - '.github/workflows/**'

jobs:
  spec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-spec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api-spec/package-lock.json

      # npm ci는 package-lock.json을 그대로 쓴다. install과 달리 잠금 파일을
      # 고쳐 쓰지 않으므로 CI와 로컬이 같은 버전을 본다(ADR-0009).
      - run: npm ci

      - name: OpenAPI 문법 검증
        run: npm run lint

      - name: 타입 생성이 실제로 되는지 확인
        run: npm run generate

      # 생성물을 커밋하면 원본과 어긋난다. CI가 그것을 막는다.
      - name: 생성물이 커밋되지 않았는지 확인
        run: |
          if git ls-files --error-unmatch dist >/dev/null 2>&1; then
            echo "::error::dist/가 커밋되어 있습니다. 생성물은 빌드 시점에 만듭니다(api-spec/README.md)."
            exit 1
          fi

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 시드는 손으로 고치는 파일이라 참조가 쉽게 깨진다. 초안에서 실제로
      # confirmedSeats와 예약 합계가 4곳 어긋난 적이 있다 — 눈으로는 안 보였다.
      - name: 시드 무결성 검사
        working-directory: fixtures
        run: npm run lint

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 네 곳에 적힌 버전이 갈라지면 패키지마다 다른 버전이 나간다.
      # 배포 시점이 아니라 여기서 잡는다.
      #
      # openapi.yaml의 info.version이 네 번째로 들어온 이유:
      #   이 값은 jar와 npm 패키지 안으로 그대로 들어가 소비자가 읽는다.
      #   0.2.0 배포본에 0.1.0이 실려 나간 일이 실제로 있었고, 그것을
      #   daylink-core-api가 의존성을 소비하다가 발견했다. 파일 셋만 맞춰서는
      #   "명세가 자기를 몇 번이라고 말하는가"가 검사되지 않는다.
      - name: 저장소 버전이 네 곳에서 같은지 확인
        run: |
          SPEC=$(node -p "require('./api-spec/package.json').version")
          FIX=$(node -p "require('./fixtures/package.json').version")
          GRADLE=$(grep '^sharedVersion=' gradle.properties | cut -d= -f2)
          INFO=$(awk '/^info:/{f=1;next} f&&/^  version:/{print $2;exit}' api-spec/openapi.yaml)
          echo "api-spec=$SPEC fixtures=$FIX gradle=$GRADLE openapi=$INFO"
          if [ "$SPEC" != "$GRADLE" ] || [ "$FIX" != "$GRADLE" ] || [ "$INFO" != "$GRADLE" ]; then
            echo "::error::버전 불일치 — api-spec=$SPEC, fixtures=$FIX, gradle.properties=$GRADLE, openapi.yaml=$INFO"
            exit 1
          fi
