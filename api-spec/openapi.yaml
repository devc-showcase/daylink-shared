# DayLink Core API 명세
#
# 이 파일이 명세의 원본이다. 네 프론트 구현과 Core API가 여기서 타입을 생성한다.
# 06 §9.1 명세 우선 — 스키마와 오류 코드를 코드보다 먼저 확정한다.
#
# 상태: 뼈대 + 본보기 1건. 나머지 엔드포인트는 직접 채운다.
#       채울 목록과 판단 기준은 design-checklist.md 참조.

openapi: 3.1.0

info:
  title: DayLink Core API
  version: 0.1.0
  description: |
    DayLink의 업무 규칙을 판정하는 단일 권위자.
    가격·재고·권한·상태 전이·정산은 전부 이 서버가 결정한다(00 §8).

    클라이언트는 서버가 계산한 값을 표시만 한다. 금액·환불액·잔여 좌석·권한을
    자체 계산하지 않는다(06 §9.3).

servers:
  - url: http://localhost:8080
    description: 로컬 개발 (ADR-0005 포트 규약)

# ─────────────────────────────────────────────────────────────
# 보안
# B2C와 Admin의 토큰 대상(audience)을 분리한다(06 §7, 00 §10.2).
# 같은 토큰으로 양쪽을 넘나들 수 없어야 한다.
# ─────────────────────────────────────────────────────────────
security:
  - customerAuth: []

tags:
  - name: hold
    description: 재고 임시 확보
  - name: booking
    description: 예약·결제·취소
  - name: checkin
    description: 출석·체크인
  - name: settlement
    description: 정산 원장

paths:
  # ═══════════════════════════════════════════════════════════
  # 본보기 — 이 엔드포인트 하나만 완전히 작성했다.
  # 나머지는 이 구조를 변형해 채운다.
  #
  # 왜 이것을 본보기로 골랐나:
  #   06 §8.1(원자적 재고 확보)과 §8.2(멱등)가 동시에 걸리는
  #   유일한 엔드포인트다. 여기를 이해하면 나머지는 변형이다.
  # ═══════════════════════════════════════════════════════════
  /holds:
    post:
      tags: [hold]
      summary: 재고 임시 확보 생성
      operationId: createHold
      description: |
        회차의 좌석을 10분간 임시 확보하고 가격 스냅숏을 함께 반환한다.

        **왜 견적과 확보가 한 요청인가.**
        나눠서 "견적 조회 → 확보 생성" 두 번 호출하면 그 사이에 가격이나
        재고가 바뀔 수 있다. 그러면 고객이 본 금액과 청구 금액이 달라진다.
        05 §5.2가 "화면 재고와 서버 최종 재고의 차이를 허용하되 결제 전에
        다시 검증한다"고 한 지점이 여기다.

        **왜 서버가 만료 시각을 돌려주나.**
        00 §7.2 — 10분 만료는 서버 시간 기준이다. 클라이언트 타이머는
        안내 수단이며 최종 권위가 아니다. 그래서 남은 초가 아니라
        절대 시각(`expiresAt`)을 준다. 브라우저 시계가 틀려도 서버 판정은
        바뀌지 않는다.

        **동시성.**
        마지막 1좌석에 동시 요청이 몰려도 정확히 하나만 성공한다(CORE-AC-01).
        구현은 데이터베이스가 판정하게 한다 — 조건부 갱신, 행 잠금, 제약 조건
        중 하나다. `SELECT` 후 검사하고 `UPDATE` 하는 두 문장은 금지다(06 §8.1).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: |
            확보 성공.

            같은 멱등 키로 재전송하면 **같은 201과 같은 본문**을 돌려준다.
            새 확보를 만들지 않는다(06 §8.2). 200으로 낮추지 않는 이유는
            클라이언트가 최초 생성과 재전송을 구분할 필요가 없기 때문이다.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '409':
          description: |
            좌석이 부족하거나 이미 처리 중이다.

            `SEAT_UNAVAILABLE`은 `details.remainingSeats`를 함께 준다.
            클라이언트가 "몇 자리 남았습니다"를 다시 계산하지 않게 하기 위함이다.

            `IDEMPOTENCY_IN_PROGRESS`는 같은 키가 아직 처리 중일 때다.
            클라이언트는 새 요청을 보내지 말고 잠시 후 같은 키로 재시도한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            입력이 업무 규칙을 위반했다. 인원 범위(1~6, 00 §6.2)가 대표적이다.

            400이 아니라 422를 쓰는 이유 — JSON 문법은 맞지만 값이 규칙에
            어긋난 경우다. 400은 파싱 자체가 안 될 때로 남겨둔다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ═══════════════════════════════════════════════════════════
  # 여기부터 직접 채운다.
  # 각 항목의 판단 기준은 design-checklist.md에 있다.
  # ═══════════════════════════════════════════════════════════

  # /holds/{holdId}:
  #   get:    확보 상태 조회 — 만료됐는지 확인
  #   delete: 확보 해제 — 00 §7.2의 RELEASED 전이

  # /bookings:
  #   post:   결제 제출 → 예약 생성 (B2C-AC-05 중복 방지)
  #           생각할 것: 응답이 유실됐을 때 클라이언트가 어떻게 복구하나?

  # /bookings/{bookingId}:
  #   get:    예약 상세 — 예약·결제·환불·출석 상태를 각각 별도 필드로(CORE-AC-09)

  # /bookings/{bookingId}/cancel-quote:
  #   get:    취소 예상액 — 서버 시각과 정책 스냅숏 기준, 기준 시각 포함(CORE-AC-07)

  # /bookings/{bookingId}/cancellation:
  #   post:   취소 실행 — 재전송이 중복 취소를 만들지 않아야 함(CORE-AC-08)
  #           생각할 것: 취소와 환불은 다른 상태다(00 §7.3·7.4). 응답을 어떻게 나눌 것인가?

  # /check-ins:
  #   post:   체크인 — clientEventId를 멱등 키로(CORE-AC-15)
  #           생각할 것: 오프라인에서 만든 이벤트가 늦게 도착하면?(06 §11.2)

  # /sessions/{sessionId}:
  #   patch:  회차 수정 — 정원 축소 제한(CORE-AC-13)

components:

  securitySchemes:
    customerAuth:
      type: http
      scheme: bearer
      description: B2C 고객 토큰. Admin 리소스에 사용할 수 없다.
    adminAuth:
      type: http
      scheme: bearer
      description: Admin 토큰. 역할·조직·장소 범위가 토큰에 담긴다(02 §3).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        모든 쓰기 요청에 필수다(00 §8).

        클라이언트가 생성한다. 같은 키 + 같은 본문 → 저장된 응답을 그대로 반환하고
        새 부작용을 만들지 않는다. 같은 키 + 다른 본문 → 거부한다(CORE-AC-05).

        체크인은 이 헤더 대신 본문의 `clientEventId`를 멱등 키로 쓴다.
        오프라인에서 만들어진 이벤트가 나중에 전송되기 때문이다(06 §11).
      schema:
        type: string
        format: uuid

  headers:
    TraceId:
      description: 요청 추적 ID. 오류 응답에도 반드시 포함된다(00 §10.4).
      schema:
        type: string

  schemas:

    # ── 공통 ────────────────────────────────────────────────
    Money:
      type: integer
      description: |
        원 단위 정수. 부동소수를 쓰지 않는다(06 §7).
        0.1 + 0.2 ≠ 0.3 문제가 금액에서 발생하면 정산 대사가 깨진다.
      examples: [50000]

    Error:
      type: object
      required: [code, messageKey, traceId, retryable]
      properties:
        code:
          type: string
          description: 안정적인 오류 코드. errors.md 참조. 클라이언트 분기의 근거다.
          examples: ['SEAT_UNAVAILABLE']
        messageKey:
          type: string
          description: |
            사용자 메시지 키. 서버가 완성된 문장을 주지 않는 이유는
            네 프론트 구현이 각자의 문구·다국어 체계를 갖기 때문이다.
          examples: ['error.seat.unavailable']
        traceId:
          type: string
        retryable:
          type: boolean
          description: |
            같은 요청을 그대로 재시도해도 되는가.
            false면 클라이언트는 입력을 바꾸거나 다른 흐름으로 가야 한다.
        details:
          type: object
          description: 코드별 부가 정보. 스키마는 코드마다 다르다.
          additionalProperties: true

    # ── Hold ────────────────────────────────────────────────
    CreateHoldRequest:
      type: object
      required: [sessionId, partySize]
      properties:
        sessionId:
          type: string
          description: 회차 식별자
        partySize:
          type: integer
          minimum: 1
          maximum: 6
          description: |
            예약 인원. 00 §6.2가 1~6으로 제한한다.

            여기에 min/max를 쓴 이유는 생성된 클라이언트 타입에 제약이 드러나
            프론트가 같은 규칙을 중복 구현하지 않게 하기 위함이다.
            다만 **최종 판정은 서버가 다시 한다.** 스키마 검증은 편의이지
            보안 경계가 아니다(06 §9.3).
        couponCode:
          type: string
          description: 선택. 서버가 검증하며 유효하지 않으면 이유를 반환한다.

    Hold:
      type: object
      required: [holdId, sessionId, partySize, expiresAt, quote, status]
      properties:
        holdId:
          type: string
        sessionId:
          type: string
        partySize:
          type: integer
        status:
          type: string
          enum: [ACTIVE, PAYMENT_PENDING, CONSUMED, EXPIRED, RELEASED]
          description: 00 §7.2의 상태 그대로다.
        expiresAt:
          type: string
          format: date-time
          description: |
            서버 기준 만료 시각(UTC). 남은 초가 아니라 절대 시각을 주는 이유는
            클라이언트 시계를 신뢰하지 않기 위함이다(00 §7.2).
        quote:
          $ref: '#/components/schemas/Quote'

    Quote:
      type: object
      required: [grossAmount, discountAmount, payableAmount, policyVersion]
      description: |
        가격 스냅숏. 00 §6.3의 공식을 그대로 담는다.
          G = 단가 × 인원, D = 쿠폰 할인, C = G - D
        수수료 F는 파트너 정산 기준이므로 고객 응답에 넣지 않는다.
      properties:
        grossAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 상품 총액 G
        discountAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 플랫폼 할인 D
        payableAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 고객 결제액 C = G - D
        policyVersion:
          type: string
          description: |
            취소 정책 버전. 예약에 스냅숏으로 저장되며, 나중에 상품 정책이
            바뀌어도 이 예약의 환불 계산은 이 버전을 쓴다(00 §6.2, 06 §4.2).

  responses:
    Unauthorized:
      description: 인증되지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        권한 없음. 다른 고객의 리소스에 접근하면 **존재 여부를 노출하지 않는다**
        (CORE-AC-10). 404와 403 중 무엇을 줄지는 리소스마다 정해야 한다 —
        design-checklist.md의 판단 항목이다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: 서버 오류. traceId를 반드시 포함한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
